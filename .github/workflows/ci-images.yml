---
name: ci-images

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      event-name:
        description: GitHub event driving the pipeline
        required: true
        type: string
      commit-sha:
        description: Commit SHA to plan for and tag images with
        required: true
        type: string
      before-sha:
        description: Previous head SHA for push events
        required: false
        type: string
        default: ""
      pr-base-sha:
        description: Base commit SHA for pull_request events
        required: false
        type: string
        default: ""
      branch:
        description: Branch name, empty for pull requests
        required: false
        type: string
        default: ""
      default-branch:
        description: Default branch name
        required: false
        type: string
        default: ""
      publish:
        description: Allow GHCR login and image push
        required: false
        type: boolean
        default: false

# No workflow-level permissions: build jobs inherit the exact grant of the
# calling job (contents: read on pull_request; plus packages: write when the
# caller publishes). The plan job explicitly downgrades itself.
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      base-changed: ${{ steps.plan.outputs.base_changed }}
      has-standalone: ${{ steps.plan.outputs.has_standalone }}
      standalone: ${{ steps.plan.outputs.standalone }}
      has-dependent: ${{ steps.plan.outputs.has_dependent }}
      dependent: ${{ steps.plan.outputs.dependent }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan affected images
        id: plan
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          BEFORE_SHA: ${{ inputs.before-sha }}
          PR_BASE_SHA: ${{ inputs.pr-base-sha }}
        run: bash scripts/build-images.sh plan

  base:
    name: base
    needs: [plan]
    if: needs.plan.outputs.base-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build base image
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
          PUBLISH: ${{ inputs.publish && '1' || '0' }}
          SAVE_BASE_TO: ${{ runner.temp }}/base-image.tar.gz
        run: bash scripts/build-images.sh build base

      - name: Upload base image for dependent jobs
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-base-image
          path: ${{ runner.temp }}/base-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  standalone:
    name: standalone ${{ matrix.image }}
    needs: [plan]
    if: needs.plan.outputs.has-standalone == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.standalone) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
          PUBLISH: ${{ inputs.publish && '1' || '0' }}
        run: bash scripts/build-images.sh build ${{ matrix.image }}

  dependent:
    name: dependent ${{ matrix.image }}
    needs: [plan, base]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      needs.plan.outputs.has-dependent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.dependent) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download base image artifact
        if: ${{ !inputs.publish && needs.base.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pr-base-image
          path: ${{ runner.temp }}

      - name: Load base image from artifact
        if: ${{ !inputs.publish && needs.base.result == 'success' }}
        run: docker load --input "${{ runner.temp }}/base-image.tar.gz"

      - name: Log in to GHCR
        if: inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        env:
          EVENT_NAME: ${{ inputs.event-name }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
          PUBLISH: ${{ inputs.publish && '1' || '0' }}
          BASE_CHANGED: ${{ needs.plan.outputs.base-changed }}
        run: bash scripts/build-images.sh build ${{ matrix.image }}
